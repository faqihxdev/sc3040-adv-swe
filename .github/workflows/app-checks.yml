name: App checks

on:
  push:
    paths:
      - "source-code/app/**"
      - ".github/workflows/app-checks.yml"
  pull_request:
    paths:
      - "source-code/app/**"
      - ".github/workflows/app-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source-code/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: source-code/app/package.json
          cache: true
          cache_dependency_path: source-code/app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: unit-coverage
          path: |
            source-code/app/reports/unit.xml
            source-code/app/coverage/
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source-code/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: source-code/app/package.json
          cache: true
          cache_dependency_path: source-code/app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm db:start
      - run: pnpm db:seed
      - run: pnpm test:db
      - run: pnpm db:restore:practice
      - run: pnpm test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: local-integration
          path: |
            source-code/app/reports/browser.xml
            source-code/app/reports/browser-*.json
            source-code/app/reports/database.txt
            source-code/app/reports/restore.json
            source-code/app/reports/load-*.json
            source-code/app/playwright-report/
          retention-days: 14
      - run: pnpm db:stop
        if: always()
